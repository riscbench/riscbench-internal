name: phase1-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-phase1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas
          pip install -e .

      - name: CLI help
        run: python cli.py --help

      - name: Golden suite
        run: python tests/run_golden_suite.py --outdir /tmp/golden_out_ci
