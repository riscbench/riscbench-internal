name: phase1-ci

on:
  push:
    paths:
      - 'Phase-2/**'
      - '.github/workflows/phase1-ci.yml'
  pull_request:
    paths:
      - 'Phase-2/**'
      - '.github/workflows/phase1-ci.yml'

jobs:
  validate-phase2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phase-2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas
          pip install -e .

      - name: CLI help
        run: python cli.py --help

      - name: Golden suite (includes Phase-0 parity)
        run: python tests/run_golden_suite.py --outdir /tmp/golden_out_ci
