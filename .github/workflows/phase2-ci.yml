name: phase2-ci

on:
  push:
    paths:
      - "Phase-2/**"
      - ".github/workflows/phase2-ci.yml"
  pull_request:
    paths:
      - "Phase-2/**"
      - ".github/workflows/phase2-ci.yml"

jobs:
  phase2-fast-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phase-2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install RISC-V/QEMU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-riscv64-linux-gnu libc6-dev-riscv64-cross

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas
          pip install -e .

      - name: Adapter fixture stability
        run: |
          python tests/check_adapter_fixtures.py

      - name: QEMU determinism smoke
        run: |
          python tests/check_determinism.py \
            --targets qemu \
            --workload hello \
            --workload-size test \
            --allow-nonzero-exit

      - name: CPU/QEMU cross-target smoke
        run: |
          python run_cross_target_suite.py \
            --targets cpu qemu \
            --workloads hello \
            --workload-size test \
            --allow-nonzero-exit
